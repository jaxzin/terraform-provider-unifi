# Autogenerated by https://github.com/appkins/ecu/github
#
# Merges are gated on a green CI/CD run (#486). This workflow used to run
# `gh pr merge --auto` for every bot PR, but `main` has no required status
# checks, so "auto" merged immediately: #483 merged at 01:54:50Z while CI/CD
# was still running and went red at 01:54:58Z. Now:
#   - PRs whose files CI/CD never runs on (e.g. GitHub Actions bumps) are merged
#     here directly, since there is no CI result to wait for;
#   - PRs that CI/CD does run on get the `automerge` label, and
#     dependabot-automerge.yml merges them after CI/CD succeeds on their head;
#   - semver-major Dependabot updates are never approved, labelled, or merged.
# Code Scanning is not a merge gate in either lane: it reports to the Security
# tab and is not a status check today.
#
# pull_request_target runs with a write token: never check out or run PR code
# here. Every step below talks to the API only.

name: Bot PR Auto-Approve
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.actor == 'jaxzin' ||
        github.actor == 'dependabot[bot]' ||
        github.actor == 'copilot[bot]' &&
        github.event.pull_request.user.login == 'copilot[bot]' &&
        github.event.pull_request.user.type == 'Bot'
      }}
    steps:
      - name: Dependabot metadata
        if: ${{github.actor == 'dependabot[bot]'}}
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: TEST ONLY fake metadata from PR title
        if: ${{github.actor == 'jaxzin'}}
        id: fakemeta
        run: |
          if [[ "$TITLE" == *"[major]"* ]]; then t=version-update:semver-major; else t=version-update:semver-minor; fi
          echo "update-type=$t" | tee -a "$GITHUB_OUTPUT"
        env:
          TITLE: ${{github.event.pull_request.title}}
      - name: Approve a PR
        continue-on-error: true  # TEST ONLY: fork disallows Actions approving PRs
        if: >-
          ${{
            github.actor != 'dependabot[bot]' && github.actor != 'jaxzin' ||
            (steps.metadata.outputs.update-type || steps.fakemeta.outputs.update-type) != 'version-update:semver-major'
          }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Merge now, or label for merge after CI/CD
        if: >-
          ${{
            github.actor != 'dependabot[bot]' && github.actor != 'jaxzin' ||
            (steps.metadata.outputs.update-type || steps.fakemeta.outputs.update-type) != 'version-update:semver-major'
          }}
        run: |
          set -euo pipefail
          # Mirrors the `paths:` filter of the pull_request trigger in ci.yaml.
          # Keep the two in sync: a path CI/CD runs on but this misses would be
          # merged without waiting for CI.
          ci_paths='(\.go$)|(^go\.mod$)|(^go\.sum$)|(^\.github/workflows/ci\.yaml$)'
          files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -Eq "$ci_paths"; then
            echo "CI/CD runs on this PR: labelling it; dependabot-automerge.yml merges it once CI/CD is green."
            gh label create automerge --repo "$GH_REPO" --force \
              --color 0e8a16 --description "Bot PR: merge after CI/CD succeeds (see dependabot-automerge.yml)"
            gh api --silent -X POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f 'labels[]=automerge'
          else
            echo "No file matches CI/CD's paths filter, so CI/CD will not run: merging now."
            gh pr merge --rebase --match-head-commit "$HEAD_SHA" "$PR_URL"
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          PR_NUMBER: ${{github.event.pull_request.number}}
          HEAD_SHA: ${{github.event.pull_request.head.sha}}
          GH_REPO: ${{github.repository}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
