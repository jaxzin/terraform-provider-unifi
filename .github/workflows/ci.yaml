# TEST ONLY stub of CI/CD for the #486 auto-merge gate test on the fork.
# Same name and paths filter as the real ci.yaml. Green unless go.mod contains
# FORCE_CI_RED; sleeps so a push can land mid-run.
name: CI/CD
on:
  pull_request:
    paths:
    - "**.go"
    - "go.mod"
    - "go.sum"
    - ".github/workflows/ci.yaml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: sleep 75
    - run: if grep -q FORCE_CI_RED go.mod; then echo "forced red"; exit 1; fi
